<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedai Senja - Jadwal Operasional</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center; /* Membuat teks dan menu ke tengah */
            padding: 20px;
            background-color: #fcf8f2; /* Warna latar belakang krem hangat */
            color: #333333;
            line-height: 1.6;
        }

        /* Mengatur ukuran dan posisi logo cangkir */
        .logo {
            max-width: 100px;
            height: auto;
            margin: 10px auto 20px auto;
            display: block;
        }

        /* Mengatur gaya menu navigasi */
        nav a {
            text-decoration: none;
            color: #6f4e37;
            font-weight: bold;
        }

        h1 {
            color: #4a2c11;
            margin-top: 25px;
        }

        /* Membuat tabel berada di tengah dan terlihat modern */
        table {
            margin: 20px auto; /* Kunci utama agar tabel berada di tengah */
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-radius: 8px;
            overflow: hidden;
            width: 90%;
            max-width: 400px; /* Batas lebar tabel di layar HP */
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #e6dfd5;
            text-align: center;
        }

        th {
            background-color: #6f4e37; /* Warna cokelat untuk kepala tabel */
            color: white;
            font-weight: bold;
        }

        td {
            color: #555555;
        }

        /* Gaya tulisan format waktu miring */
        .format-waktu {
            font-style: italic;
            color: #777777;
            margin-top: 10px;
        }
    </style>
</head>
<body>
 

<img src="logo.png" alt="Logo Diska Smoothies" width ="150">

    </nav>

            </tr>
        </thead>
